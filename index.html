<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Barn House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: the 3D model fills the page and stands on graph paper (1 square = 1 m);
     one control card sits top-left, hand-lettered tags float in the scene.
     Single theme by choice: the page is the sheet of paper the sketch was drawn on. */
  --paper:#f4f3ee;
  --grid:#c9ced2;
  --graphite:#2f3236;
  --graphite-soft:#676d74;
  --ink:#2a55a6;
  --wood:#c49a62;
  --card:rgba(255,255,255,.92);
  --display:"Architects Daughter","Segoe Print","Bradley Hand",cursive;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--graphite);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--graphite);background:rgba(244,243,238,.82);padding:0 6px;border-radius:3px;will-change:transform}
.tag.dim{color:var(--ink);text-transform:none;font-family:var(--body);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.tag.zone{color:var(--graphite-soft)}

#card{position:absolute;left:16px;top:16px;width:272px;max-height:calc(100% - 32px);overflow:auto;background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(47,50,54,.10)}
#card h1{font-family:var(--display);font-size:22px;font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
#card .sub{margin:2px 0 0;color:var(--graphite-soft);font-size:12.5px}
.group-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite-soft);margin:0 0 6px}
.views{display:flex;flex-wrap:wrap;gap:6px}
button.view{font:inherit;font-size:13px;font-weight:500;color:var(--graphite);background:#fff;border:1px solid var(--grid);border-radius:6px;padding:6px 10px;cursor:pointer}
button.view:hover{border-color:var(--graphite-soft)}
button.view[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
button.view:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px}
.toggles label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.toggles input{accent-color:var(--ink);width:15px;height:15px;margin:0}
details{border-top:1px solid var(--grid);padding-top:10px}
summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite-soft)}
.sliders{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;font-size:13px}
.slider output{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.slider input{grid-column:1 / -1;width:100%;accent-color:var(--ink);margin:0}
.readout{margin:0;font-size:12.5px;color:var(--graphite-soft);font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:12px;color:var(--graphite-soft)}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px}
#fail[hidden]{display:none}

@media (max-width:640px){
  #card{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46%;padding:10px 12px 8px;gap:8px}
  #card h1{font-size:18px}
  .views{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  button.view{white-space:nowrap}
  .hint{display:none}
  .tag{font-size:11px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels" aria-hidden="true"></div>

  <section id="card" aria-label="Model controls">
    <header>
      <h1>Glass barn house</h1>
      <p class="sub">Layout sketch v10. One grid square is 1 m.</p>
    </header>

    <div>
      <p class="group-label" id="views-label">Views</p>
      <div class="views" role="group" aria-labelledby="views-label">
        <button class="view" type="button" data-view="sketch" aria-pressed="true">Your sketch</button>
        <button class="view" type="button" data-view="layout" aria-pressed="false">Layout</button>
        <button class="view" type="button" data-view="plan" aria-pressed="false">Plan</button>
        <button class="view" type="button" data-view="sofa" aria-pressed="false">From the sofa</button>
        <button class="view" type="button" data-view="balcony" aria-pressed="false">From the balcony</button>
        <button class="view" type="button" data-view="terrace" aria-pressed="false">Terrace side</button>
        <button class="view" type="button" data-view="entrance" aria-pressed="false">Entrance side</button>
      </div>
    </div>

    <div class="toggles">
      <label for="t-roof"><input type="checkbox" id="t-roof" checked> Roof</label>
      <label for="t-up"><input type="checkbox" id="t-up" checked> Upper floor</label>
      <label for="t-upt"><input type="checkbox" id="t-upt" checked> Upper terrace</label>
      <label for="t-xray"><input type="checkbox" id="t-xray"> See-through walls</label>
      <label for="t-labels"><input type="checkbox" id="t-labels" checked> Labels</label>
    </div>

    <details id="props" open>
      <summary>Proportions</summary>
      <div class="sliders">
        <div class="slider">
          <label for="s-eave">Wall height</label><output id="o-eave" for="s-eave">6.0 m</output>
          <input type="range" id="s-eave" min="4.5" max="9" step="0.5" value="6">
        </div>
        <div class="slider">
          <label for="s-width">House width</label><output id="o-width" for="s-width">9.5 m</output>
          <input type="range" id="s-width" min="8" max="11" step="0.5" value="9.5">
        </div>
        <div class="slider">
          <label for="s-pitch">Roof pitch</label><output id="o-pitch" for="s-pitch">30°</output>
          <input type="range" id="s-pitch" min="20" max="55" step="1" value="30">
        </div>
        <div class="slider">
          <label for="s-floor">Upper floor level</label><output id="o-floor" for="s-floor">3.0 m</output>
          <input type="range" id="s-floor" min="2.6" max="4.5" step="0.1" value="3">
        </div>
        <p class="readout" id="readout"></p>
      </div>
    </details>

    <p class="hint">Drag to orbit, scroll to zoom, right-drag to pan. The blue figures are 1.8 m tall.</p>
  </section>

  <div id="fail" hidden>The 3D library did not load, so the model cannot be shown. Reload the page to try again.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE || !THREE.OrbitControls) { document.getElementById('fail').hidden = false; return; }

  /* ---------- fixed footprint, read off the paper grid (metres) ----------
     x runs along the house from the TV gable wall (north) to the right (south).
     z runs across the house: 0 = terrace wall (east), 8 = glass wall (west, sunset). */
  var W = 9.5;      // house width (the sketch had 8; widened for roomier landings and walkways)
  var GL = 8;       // length of the glass wall + glass roof section
  var L = 29.5;     // length of the main bar
  var WX0 = 19.5, WX1 = 29.5, WZ = -20;   // L wing: turns towards the terrace side at the far end
  var GZ = -14, UZ = -3.4, UX0 = 22.4;     // wing partitions: garage | gym, and the utility room by the house
  var TD = 3.5;     // terrace depth
  var BASE = 0.2;   // floor level above the field
  var WT = 0.3;     // wall thickness
  var ST_X0 = 11, ST_X1 = 13, ST_ZB = 6, ST_ZT = 1.1; // stairs: bottom at z=6, landing from z=1.1 to the wall

  var P = { eave: 6, pitch: 30, floor2: 3.0, width: 9.5 };
  var state = { roof: true, up: true, upt: true, xray: false, labels: true };

  var stage = document.getElementById('stage');
  var labelLayer = document.getElementById('labels');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- renderer, scene, camera ---------- */
  var PAPER = 0xf4f3ee;
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(PAPER, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(PAPER, 80, 210);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.minDistance = 0.5;
  controls.maxDistance = 140;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d4c6, 0.66));
  var sun = new THREE.DirectionalLight(0xfff4e2, 0.52);
  sun.position.set(L / 2 + 12, 30, W / 2 + 34);   // from the south-west: afternoon sun on the glass side
  sun.target.position.set(L / 2, 0, W / 2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -36; sun.shadow.camera.right = 36;
  sun.shadow.camera.top = 36; sun.shadow.camera.bottom = -36;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 110;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
  scene.add(sun); scene.add(sun.target);

  /* ---------- hand-drawn textures, one tile = 1 m (ground tile = 5 m) ---------- */
  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed & 0xffff) / 0xffff; }; }
  function tile(size, draw) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  }
  var TEX = {
    clad: tile(256, function (g, s) {            // vertical raw timber boards
      var r = rng(7); g.fillStyle = '#d6b88b'; g.fillRect(0, 0, s, s);
      for (var i = 0; i < 8; i++) {
        g.fillStyle = 'rgba(120,84,40,' + (0.02 + 0.10 * r()).toFixed(3) + ')'; g.fillRect(i * 32, 0, 32, s);
        g.fillStyle = 'rgba(86,60,30,.55)'; g.fillRect(i * 32, 0, 1.5, s);
      }
    }),
    seam: tile(256, function (g, s) {            // standing-seam metal, seams run up the slope
      g.fillStyle = '#51555b'; g.fillRect(0, 0, s, s);
      for (var i = 0; i < 2; i++) { g.fillStyle = '#3a3d42'; g.fillRect(i * 128, 0, 3, s); g.fillStyle = '#737981'; g.fillRect(i * 128 + 3, 0, 1.5, s); }
    }),
    seamR: tile(256, function (g, s) {           // same seams, turned for the wing roof
      g.fillStyle = '#51555b'; g.fillRect(0, 0, s, s);
      for (var i = 0; i < 2; i++) { g.fillStyle = '#3a3d42'; g.fillRect(0, i * 128, s, 3); g.fillStyle = '#737981'; g.fillRect(0, i * 128 + 3, s, 1.5); }
    }),
    brick: tile(256, function (g, s) {           // muted reclaimed brick
      var r = rng(21); g.fillStyle = '#d9cebf'; g.fillRect(0, 0, s, s);
      var ch = s / 12, bw = s / 4;
      for (var row = 0; row < 12; row++) for (var k = -1; k < 4; k++) {
        var v = r(); g.fillStyle = 'rgb(' + Math.round(168 + 22 * v) + ',' + Math.round(112 + 18 * v) + ',' + Math.round(86 + 16 * v) + ')';
        g.fillRect(k * bw + (row % 2 ? bw / 2 : 0) + 1.5, row * ch + 1.5, bw - 3, ch - 3);
      }
    }),
    floor: tile(256, function (g, s) {           // floor boards running along the house
      var r = rng(3); g.fillStyle = '#d5b17d'; g.fillRect(0, 0, s, s);
      var bh = s / 6;
      for (var i = 0; i < 6; i++) {
        g.fillStyle = 'rgba(125,88,42,' + (0.02 + 0.09 * r()).toFixed(3) + ')'; g.fillRect(0, i * bh, s, bh);
        g.fillStyle = 'rgba(96,68,34,.5)'; g.fillRect(0, i * bh, s, 1.2);
        g.fillRect(Math.floor(r() * s), i * bh, 1.2, bh);
      }
    }),
    deck: tile(256, function (g, s) {            // terrace decking, boards across the terrace
      var r = rng(11); g.fillStyle = '#bf9d70'; g.fillRect(0, 0, s, s);
      var bw = s / 7;
      for (var i = 0; i < 7; i++) {
        g.fillStyle = 'rgba(96,66,30,' + (0.03 + 0.10 * r()).toFixed(3) + ')'; g.fillRect(i * bw, 0, bw, s);
        g.fillStyle = 'rgba(70,48,24,.6)'; g.fillRect(i * bw, 0, 2, s);
      }
    }),
    paper: tile(512, function (g, s) {           // graph paper: 1 m squares, heavier line every 5 m
      g.fillStyle = '#f4f3ee'; g.fillRect(0, 0, s, s);
      var c = s / 5;
      g.fillStyle = '#cdd2d6';
      for (var i = 1; i < 5; i++) { g.fillRect(i * c - 1, 0, 2, s); g.fillRect(0, i * c - 1, s, 2); }
      g.fillStyle = '#aab2b9'; g.fillRect(0, 0, 2.5, s); g.fillRect(s - 2.5, 0, 2.5, s); g.fillRect(0, 0, s, 2.5); g.fillRect(0, s - 2.5, s, 2.5);
    })
  };

  /* ---------- materials ---------- */
  var KIND = {
    clad:    { tex: 'clad', solid: true },
    brickw:  { tex: 'brick', solid: true },
    plaster: { color: 0xefe9dd, solid: true },
    seam:    { tex: 'seam', solid: true },
    seamR:   { tex: 'seamR', solid: true },
    roofdk:  { color: 0x474a4f, solid: true },
    soffit:  { color: 0xdcc296, solid: true },
    ceil:    { color: 0xdcc296 },
    brick:   { tex: 'brick' },
    floor:   { tex: 'floor' },
    deck:    { tex: 'deck' }
  };
  var matCache = {}, solidMats = [];
  function applyXray(m) {
    m.transparent = state.xray; m.opacity = state.xray ? 0.13 : 1; m.depthWrite = !state.xray; m.needsUpdate = true;
  }
  function M(kind, rx, ry) {
    rx = rx || 1; ry = ry || 1;
    var key = kind + '|' + rx.toFixed(2) + '|' + ry.toFixed(2);
    if (matCache[key]) return matCache[key];
    var d = KIND[kind], m;
    if (d.tex) { var t = TEX[d.tex].clone(); t.repeat.set(rx, ry); t.needsUpdate = true; m = new THREE.MeshLambertMaterial({ map: t }); }
    else m = new THREE.MeshLambertMaterial({ color: d.color });
    if (d.solid) { solidMats.push(m); applyXray(m); }
    matCache[key] = m; return m;
  }
  function clearMats() {
    Object.keys(matCache).forEach(function (k) { var m = matCache[k]; if (m.map) m.map.dispose(); m.dispose(); });
    matCache = {}; solidMats.length = 0;
  }
  function flat(hex) { return new THREE.MeshLambertMaterial({ color: hex }); }
  var MAT = {
    frame: flat(0x9a7446),      // timber posts, rafters, rails
    car: flat(0x7d8892),
    water: flat(0xa9d3dc),
    gravel: flat(0xdedad0),
    rubber: flat(0x3b3e42),
    steel: flat(0x6f757c),
    woodDk: flat(0xa88255),
    woodLt: flat(0xd3b181),
    leather: flat(0xa2623a),
    rug: flat(0xe8e2d5),
    dark: flat(0x2c2d30),
    white: flat(0xf3f0ea),
    stone: flat(0xcfcac0),
    panel: flat(0x1f2a44),
    slab: flat(0xd9d5cb),
    ink: flat(0x2a55a6),
    glass: new THREE.MeshPhongMaterial({ color: 0x9fd0dc, transparent: true, opacity: 0.27, shininess: 90, specular: 0xffffff, depthWrite: false }),
    line: new THREE.LineBasicMaterial({ color: 0x2f3236, transparent: true, opacity: 0.42 }),
    inkLine: new THREE.LineBasicMaterial({ color: 0x2a55a6 }),
    dash: new THREE.LineDashedMaterial({ color: 0x676d74, dashSize: 0.28, gapSize: 0.2 })
  };

  /* ---------- small builders ---------- */
  function addEdges(mesh) { mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 20), MAT.line)); }
  function box(parent, x0, x1, y0, y1, z0, z1, mat, o) {
    o = o || {};
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    var isGlass = mat === MAT.glass;
    mesh.castShadow = !isGlass && o.cast !== false;
    mesh.receiveShadow = !isGlass;
    parent.add(mesh);
    if (o.edges !== false) addEdges(mesh);
    return mesh;
  }
  // six face materials for a textured box: [+x, -x, +y, -y, +z, -z]
  function texBox(kind, dx, dy, dz) {
    return [M(kind, dz, dy), M(kind, dz, dy), M(kind, dx, dz), M(kind, dx, dz), M(kind, dx, dy), M(kind, dx, dy)];
  }
  // a wall drawn as a polygon in the (z, y) plane, standing at x..x+t
  function gable(parent, pts, x, t, mat, holes) {
    var sh = new THREE.Shape();
    pts.forEach(function (p, i) { if (i) sh.lineTo(p[0], p[1]); else sh.moveTo(p[0], p[1]); });
    (holes || []).forEach(function (h) {             // rectangular openings [z0, z1, y0, y1]
      var hp = new THREE.Path(); hp.moveTo(h[0], h[2]); hp.lineTo(h[1], h[2]); hp.lineTo(h[1], h[3]); hp.lineTo(h[0], h[3]); hp.lineTo(h[0], h[2]);
      sh.holes.push(hp);
    });
    var mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: false }), mat);
    mesh.rotation.y = -Math.PI / 2; mesh.position.set(x + t, 0, 0);
    var isGlass = mat === MAT.glass;
    mesh.castShadow = !isGlass; mesh.receiveShadow = !isGlass;
    parent.add(mesh); addEdges(mesh);
    return mesh;
  }
  // the same for a wall drawn in the (x, y) plane, standing at z..z+t
  function gableZ(parent, pts, z, t, mat) {
    var sh = new THREE.Shape();
    pts.forEach(function (p, i) { if (i) sh.lineTo(p[0], p[1]); else sh.moveTo(p[0], p[1]); });
    var mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: false }), mat);
    mesh.position.set(0, 0, z); mesh.castShadow = true; mesh.receiveShadow = true;
    parent.add(mesh); addEdges(mesh); return mesh;
  }
  function polyline(parent, pts, mat, dashed) {
    var g = new THREE.BufferGeometry().setFromPoints(pts.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); }));
    var l = new THREE.Line(g, mat); if (dashed) l.computeLineDistances(); parent.add(l); return l;
  }
  function person(parent, x, y, z) {
    var g = new THREE.Group();
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.19, 1.5, 14), MAT.ink); body.position.y = 0.75;
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 10), MAT.ink); head.position.y = 1.66;
    body.castShadow = head.castShadow = true;
    g.add(body); g.add(head); g.position.set(x, y, z); parent.add(g);
  }

  /* ---------- labels ---------- */
  var labels = [];
  function tag(text, x, y, z, cls, only) {
    var el = document.createElement('div'); el.className = 'tag' + (cls ? ' ' + cls : ''); el.textContent = text;
    labelLayer.appendChild(el);
    labels.push({ el: el, pos: new THREE.Vector3(x, y, z), only: only || '', hidden: false });
  }
  // a label is hidden while something solid stands between it and the eye (glass does not count)
  var occluders = [], ray = new THREE.Raycaster(), dir = new THREE.Vector3(), tick = 0;
  function checkOcclusion() {
    var active = occluders.filter(function (o) {
      return (!o.roof || state.roof) && (!o.up || state.up) && (!o.upt || state.upt) && !(o.solid && state.xray);
    }).map(function (o) { return o.mesh; });
    labels.forEach(function (l) {
      dir.copy(l.pos).sub(camera.position); var d = dir.length(); dir.normalize();
      ray.set(camera.position, dir); ray.near = 0.05; ray.far = d - 0.12;
      l.hidden = d > 0.2 && ray.intersectObjects(active, false).length > 0;
    });
  }
  function clearLabels() { labels.forEach(function (l) { l.el.remove(); }); labels = []; }
  var tmp = new THREE.Vector3();
  function updateLabels() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (state.labels && (tick++ % 4 === 0)) checkOcclusion();
    for (var i = 0; i < labels.length; i++) {
      var l = labels[i], show = state.labels && !l.hidden && (l.only !== 'roof' || state.roof) && (l.only !== 'up' || state.up) && (l.only !== 'upt' || state.upt);
      if (show) {
        tmp.copy(l.pos).applyMatrix4(camera.matrixWorldInverse);
        show = tmp.z < -0.4;
        if (show) {
          tmp.copy(l.pos).project(camera);
          show = Math.abs(tmp.x) < 1.02 && Math.abs(tmp.y) < 1.02;
          if (show) l.el.style.transform = 'translate(-50%,-50%) translate(' + ((tmp.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - tmp.y) / 2 * h).toFixed(1) + 'px)';
        }
      }

    document.getElementById('t-' + key).addEventListener('change', function (e) { setToggle(key, e.target.checked); });
  });
  document.querySelectorAll('button.view').forEach(function (b) { b.addEventListener('click', function () { goTo(b.dataset.view); }); });

  var sWidth = document.getElementById('s-width'), sEave = document.getElementById('s-eave'), sPitch = document.getElementById('s-pitch'), sFloor = document.getElementById('s-floor');
  function syncSliders() {
    P.eave = parseFloat(sEave.value); P.pitch = parseFloat(sPitch.value); P.width = parseFloat(sWidth.value); W = P.width;
    document.getElementById('o-width').textContent = W.toFixed(1) + ' m';
    var maxF = Math.min(4.5, P.eave - 2.3);
    if (parseFloat(sFloor.value) > maxF) sFloor.value = maxF.toFixed(1);
    P.floor2 = parseFloat(sFloor.value);
    document.getElementById('o-eave').textContent = P.eave.toFixed(1) + ' m';
    document.getElementById('o-pitch').textContent = P.pitch.toFixed(0) + '°';
    document.getElementById('o-floor').textContent = P.floor2.toFixed(1) + ' m';
    build();
  }
  [sWidth, sEave, sPitch, sFloor].forEach(function (s) { s.addEventListener('input', syncSliders); });

  /* ---------- sizing + loop ---------- */
  function resize() {
    var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  if (window.matchMedia('(max-width:640px)').matches) document.getElementById('props').open = false;

  function frame(now) {
    if (tween) {
      var f = Math.min(1, (now - tween.t0) / tween.dur), e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
      camera.fov = tween.f0 + (tween.f1 - tween.f0) * e; camera.updateProjectionMatrix();
      if (f >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
    updateLabels();
    requestAnimationFrame(frame);
  }

  resize(); build(); goTo('sketch', true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
